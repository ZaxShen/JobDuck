name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      framework: ${{ steps.classify.outputs.framework }}
      installer: ${{ steps.classify.outputs.installer }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - name: Classify the pull request's files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            printf 'framework=true\ninstaller=true\nweb=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          printf '%s\n' "$files"
          has() { if printf '%s\n' "$files" | grep -vE '^framework/(README|CLAUDE)\.md$' | grep -qE "$1"; then echo true; else echo false; fi; }
          echo "framework=$(has '^(framework/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "installer=$(has '^(install\.sh|\.github/workflows/ci\.yml)$')" >> "$GITHUB_OUTPUT"
          echo "web=$(has '^(framework/web/|framework/src/dashboard/public/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"

  framework:
    name: framework (typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Rebuild the dashboard and require the committed output
        if: needs.changes.outputs.web == 'true'
        run: |
          bun run build:web
          if [ -n "$(git status --porcelain -- src/dashboard/public)" ]; then
            git status --porcelain -- src/dashboard/public
            echo "src/dashboard/public is stale: run 'bun run build:web' in framework/ and commit the result" >&2
            exit 1
          fi
      - run: bun run typecheck
      - run: bun run build
      - run: bun test

  smoke:
    name: smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: framework
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run smoke

  installer:
    name: install.sh (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest release with install.sh
        run: |
          JOBDUCK_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/jobduck" --version
          "$RUNNER_TEMP/bin/jobduck" init --dry-run --workspace "$RUNNER_TEMP"
      - name: Install the newest release on the rc channel
        run: |
          JOBDUCK_CHANNEL=rc JOBDUCK_INSTALL_DIR="$RUNNER_TEMP/rc" sh install.sh
          "$RUNNER_TEMP/rc/jobduck" --version

  ci:
    name: ci
    if: always()
    needs: [changes, framework, smoke, installer]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"' && exit 1
          echo '${{ toJSON(needs) }}' | grep -q '"result": "cancelled"' && exit 1
          exit 0
