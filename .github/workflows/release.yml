name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release gate
        id: gate
        run: |
          gate=$(bash scripts/release-gate.sh "$GITHUB_REF_NAME")
          echo "$gate"
          echo "$gate" >> "$GITHUB_OUTPUT"
      - name: Release candidate was published
        if: steps.gate.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.gate.outputs.rc }}
        run: |
          if [ "$(gh release view "$RC" --json isPrerelease --jq .isPrerelease)" != "true" ]; then
            echo "$RC has no published prerelease; nobody could have tested it" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Tag matches package.json version
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: bash scripts/build-all.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.gate.outputs.channel }}
          PREVIOUS: ${{ steps.gate.outputs.previous }}
        run: |
          flags=()
          if [ "$CHANNEL" = rc ]; then flags+=(--prerelease); fi
          if [ -n "$PREVIOUS" ]; then flags+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$GITHUB_REF_NAME" dist/jobduck-* dist/SHA256SUMS --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}"
